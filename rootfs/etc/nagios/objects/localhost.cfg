define host {
    use                 crunchtools-host
    host_name           lotor
    alias               lotor.dc3.crunchtools.com
    address             10.88.0.1
}

define service {
    use                 crunchtools-service
    host_name           lotor
    service_description Nagios httpd
    check_command       check_tcp_port!127.0.0.1!80
}
