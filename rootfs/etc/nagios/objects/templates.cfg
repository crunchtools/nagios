define host {
    name                            crunchtools-host
    check_command                   check-host-alive
    max_check_attempts              3
    check_interval                  5
    retry_interval                  1
    check_period                    24x7
    notification_interval           60
    notification_period             24x7
    notification_options            d,u,r
    contact_groups                  admins
    register                        0
}

define service {
    name                            crunchtools-service
    max_check_attempts              3
    check_interval                  2
    retry_interval                  1
    check_period                    24x7
    notification_interval           60
    notification_period             24x7
    notification_options            w,u,c,r
    contact_groups                  admins
    register                        0
}

define service {
    name                            crunchtools-service-slow
    use                             crunchtools-service
    check_interval                  5
    register                        0
}
