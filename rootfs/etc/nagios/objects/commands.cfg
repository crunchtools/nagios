# Host alive check
define command {
    command_name    check-host-alive
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 5
}

# Check commands

define command {
    command_name    check_tcp_port
    command_line    $USER1$/check_tcp -H $ARG1$ -p $ARG2$ -t 10
}

define command {
    command_name    check_http_url
    command_line    $USER1$/check_http -H $ARG1$ -p $ARG2$ -u $ARG3$ -t 15
}

define command {
    command_name    check_http_status
    command_line    $USER1$/check_http -H $ARG1$ -p $ARG2$ -t 15
}

define command {
    command_name    check_nrpe_command
    command_line    $USER1$/check_nrpe -H $ARG1$ -c $ARG2$ -t 30
}

# Notification commands — dual: email + Hermes webhook

define command {
    command_name    notify-service-by-email
    command_line    /usr/bin/printf "%b" "***** Nagios *****\n\nService: $SERVICEDESC$\nHost: $HOSTALIAS$\nState: $SERVICESTATE$\n\nDate/Time: $LONGDATETIME$\n\nInfo:\n$SERVICEOUTPUT$\n" | /usr/bin/mail -S mta=smtp://10.88.0.1:25 -S from=nagios@crunchtools.com -s "** $NOTIFICATIONTYPE$ - $HOSTALIAS$/$SERVICEDESC$ is $SERVICESTATE$ **" $CONTACTEMAIL$
}

define command {
    command_name    notify-host-by-email
    command_line    /usr/bin/printf "%b" "***** Nagios *****\n\nHost: $HOSTNAME$\nState: $HOSTSTATE$\n\nDate/Time: $LONGDATETIME$\n\nInfo:\n$HOSTOUTPUT$\n" | /usr/bin/mail -S mta=smtp://10.88.0.1:25 -S from=nagios@crunchtools.com -s "** $NOTIFICATIONTYPE$ - $HOSTNAME$ is $HOSTSTATE$ **" $CONTACTEMAIL$
}

define command {
    command_name    notify-hermes-service
    command_line    /usr/local/bin/notify_hermes.sh
}

define command {
    command_name    notify-hermes-host
    command_line    /usr/local/bin/notify_hermes.sh
}
